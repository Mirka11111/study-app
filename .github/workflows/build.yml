name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate platforms
        run: |
          flutter create --platforms=android --org com.studytracker .

      - name: Fix Desugaring Configuration
        run: |
          python3 -c "
          p = 'android/app/build.gradle.kts'
          with open(p, 'r') as f:
              s = f.read()

          # Задаем minSdk 21
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')

          # Включаем флаг desugaring внутри compileOptions
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')

          with open(p, 'w') as f:
              f.write(s)
          "
          # Гарантированно дописываем блок dependencies с нужной библиотекой в конец файла
          cat << 'EOF' >> android/app/build.gradle.kts

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
          }
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-S25Ultra-APK
          path: build/app/outputs/flutter-apk/app-release.apk
